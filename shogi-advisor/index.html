<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>将棋アドバイザー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="board-area" aria-label="将棋盤">
        <div class="topbar">
          <div>
            <p class="eyebrow">Shogi Advisor</p>
            <h1>将棋アドバイザー</h1>
          </div>
          <button id="newGame" class="icon-button" type="button" title="新しい対局">↻</button>
        </div>

        <div class="captured cpu">
          <span class="zone-label">CPUの持ち駒</span>
          <div id="goteHand" class="hand"></div>
        </div>

        <div id="board" class="board" role="grid" aria-label="将棋盤"></div>

        <div class="captured player">
          <span class="zone-label">あなたの持ち駒</span>
          <div id="senteHand" class="hand"></div>
        </div>
      </section>

      <aside class="panel" aria-label="アドバイス">
        <div class="status-block">
          <p class="label">手番</p>
          <p id="turnText" class="status">あなたの番</p>
        </div>

        <div class="tabs" role="tablist" aria-label="情報表示">
          <button class="tab active" data-tab="advice" type="button">助言</button>
          <button class="tab" data-tab="moves" type="button">棋譜</button>
        </div>

        <section id="advicePane" class="pane active">
          <div class="meter">
            <div class="meter-top">
              <span>局面評価</span>
              <strong id="scoreText">互角</strong>
            </div>
            <div class="bar"><span id="scoreBar"></span></div>
          </div>
          <div class="advice-card">
            <p class="label">次のおすすめ</p>
            <p id="bestMove" class="big-text">初手は飛車先の歩、または角道を開ける手が自然です。</p>
          </div>
          <div class="advice-card">
            <p class="label">直前の手へのコメント</p>
            <p id="moveAdvice">駒を動かすと、この欄に毎回アドバイスが出ます。</p>
          </div>
          <div class="advice-card">
            <p class="label">CPUの狙い</p>
            <p id="cpuPlan">まだCPUは動いていません。</p>
          </div>
        </section>

        <section id="movesPane" class="pane">
          <ol id="moveList" class="moves"></ol>
        </section>
      </aside>
    </main>

    <div id="promotionDialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="promoteTitle">
      <div class="modal-content">
        <h2 id="promoteTitle">成りますか？</h2>
        <div class="modal-actions">
          <button id="promoteYes" type="button">成る</button>
          <button id="promoteNo" type="button">成らない</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

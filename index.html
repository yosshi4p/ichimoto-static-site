
<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>400字小説集</title>

  <meta name="description"
        content="一本吉夫（いちもとよしお）の400字小説。短い物語を、少しずつ増やしていきます。">

  <!-- 既存のCSSをそのまま使用 -->
  <link rel="stylesheet" href="./assets/style.css">

</head>

<body>

  <!-- ==========================================
       トップページ
       ========================================== -->

  <main class="container">

    <!-- ヒーローエリア -->
    <section class="hero">

      <h1>400字小説集 作品一覧</h1>

      <p>
        短い物語を、静かに増やしていく。
      </p>

      <!-- アプリへのリンク -->
      <div class="hero-cta">

        <div class="hero-cta-actions">

          <!-- AIアプリ研究所 -->
          <a class="btn btn-primary"
             href="./ai-app-lab.html">
            AIアプリ研究所
          </a>

          <!-- 400字小説作成アプリ -->
          <a class="btn"
             href="https://www.ichimoto-yoshio.com/"
             target="_blank"
             rel="noopener noreferrer">
            400字小説作成アプリ
          </a>

        </div>

        <p class="hero-note">
          ※自作AIアプリは、別ページのAIアプリ研究所に並べていきます。
        </p>

      </div>

    </section>


    <!-- ========================================
         小説一覧
         PostgreSQLから自動取得
         ======================================== -->

    <section id="stories"
             class="grid"
             aria-label="作品リスト"
             aria-live="polite">

      <p role="status">作品を読み込み中です...</p>

    </section>

  </main>


  <!-- ==========================================
       フッター
       ========================================== -->

  <footer class="site-footer">

    <div class="container">

      <div>
        © 一本吉夫（いちもとよしお）
      </div>

    </div>

  </footer>


  <!-- ==========================================
       PostgreSQL作品一覧取得処理
       ========================================== -->

  <script>

    // Render側の公開作品API
    const API_URL =
      "https://www.ichimoto-yoshio.com/api/stories";


    // 個別作品ページのURL
    const STORY_URL =
      "https://www.ichimoto-yoshio.com/stories/";


    // ==========================================
    // DBから小説一覧を取得
    // ==========================================

    async function loadStories() {

      const container =
        document.getElementById("stories");

      try {

        // Flask APIへアクセス
        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        // HTTPエラー確認
        if (!response.ok) {
          throw new Error(
            "作品データの取得に失敗しました"
          );
        }

        // JSONデータを取得
        const stories = await response.json();

        if (!Array.isArray(stories) || !stories.every(function(story) {
          return Number.isInteger(story.id) &&
            story.id > 0 &&
            typeof story.title === "string" &&
            typeof story.excerpt === "string";
        })) {
          throw new Error("作品データの形式が正しくありません");
        }

        // 一覧を初期化
        container.replaceChildren();


        // ======================================
        // 公開作品が0件の場合
        // ======================================

        if (stories.length === 0) {

          const message =
            document.createElement("p");

          message.textContent =
            "現在、公開中の作品はありません。";

          container.appendChild(message);

          return;
        }


        // ======================================
        // 作品ごとにカードを作成
        // ======================================

        stories.forEach(function(story) {

          // カード全体を個別ページへのリンクにする
          const cardLink =
            document.createElement("a");

          cardLink.className = "card-link";

          cardLink.href =
            STORY_URL + encodeURIComponent(story.id);


          // カード
          const article =
            document.createElement("article");

          article.className = "card";


          // タイトル
          const h2 =
            document.createElement("h2");


          h2.textContent =
            "《" + story.title + "》";


          // 本文冒頭
          const p =
            document.createElement("p");

          const excerpt = story.excerpt || "";

          p.textContent =
            excerpt +
            (excerpt ? "…" : "");


          // カードを組み立てる
          article.appendChild(h2);

          article.appendChild(p);


          // カード全体をリンクにする
          cardLink.appendChild(article);


          // 作品一覧へカード追加
          container.appendChild(cardLink);

        });


      } catch (error) {

        console.error(
          "作品一覧取得エラー:",
          error
        );

        container.replaceChildren();

        const message =
          document.createElement("p");

        message.textContent =
          "作品を読み込めませんでした。" +
          "時間をおいて再度お試しください。";

        message.setAttribute("role", "alert");

        message.className = "load-error";

        container.appendChild(message);

      }

    }


    // ==========================================
    // ページを開いたら作品取得を実行
    // ==========================================

    loadStories();

  </script>

</body>

</html>
